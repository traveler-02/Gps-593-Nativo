# Crea los archivos para usar GPS 593 sin internet y los publica en una Release del repositorio:
#   ecuador.pmtiles  (mapa)      ecuador.g593  (rutas y búsqueda sin conexión)
# Uso: pestaña Actions > "Crear mapa y rutas de Ecuador" > Run workflow.
# Primero con dry_run activado (solo muestra el tamaño del mapa). Después desactívalo.
# Las Releases admiten archivos de hasta 2 GiB y no gastan la cuota de 500 MB de los artefactos.
# NUEVO: también genera manifest.json (versión, tamaños y sumas SHA-256) para la descarga dentro de la app,
# y, si configuras las variables R2_BUCKET y R2_ENDPOINT, sube todo a Cloudflare R2 (ver DISTRIBUCION.md).
name: Crear mapa y rutas de Ecuador
on:
  workflow_dispatch:
    inputs:
      bbox:
        description: 'Zona del mapa: lon_min,lat_min,lon_max,lat_max (Ecuador continental por defecto)'
        default: '-81.1,-5.1,-75.1,1.5'
      maxzoom:
        description: 'Zoom máximo del mapa (cada nivel duplica el tamaño aprox.; prueba 12, 13 o 14)'
        default: '13'
      nombre:
        description: 'Nombre base de los archivos'
        default: 'ecuador'
      sin_servicio:
        description: 'Rutas más livianas: sin calles de servicio (recomendado para radios con poca memoria)'
        type: boolean
        default: true
      overture:
        description: 'Sumar a la búsqueda comercios de Overture Maps (datos abiertos; más lugares)'
        type: boolean
        default: false
      dry_run:
        description: 'Solo calcular el tamaño del mapa (no crea ni publica nada)'
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  crear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar pmtiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R protomaps/go-pmtiles -p '*Linux_x86_64.tar.gz' -D /tmp/pm
          mkdir -p /tmp/pm/bin && tar xzf /tmp/pm/*.tar.gz -C /tmp/pm/bin
      - name: Mapa (.pmtiles)
        run: |
          for d in 1 2 3; do
            day=$(date -u -d "$d day ago" +%Y%m%d)
            if curl -sf -r 0-0 -o /dev/null "https://build.protomaps.com/$day.pmtiles"; then break; fi
          done
          echo "Usando la compilación del $day"
          EXTRA=""; if [ "${{ inputs.dry_run }}" = "true" ]; then EXTRA="--dry-run"; fi
          /tmp/pm/bin/pmtiles extract "https://build.protomaps.com/$day.pmtiles" "${{ inputs.nombre }}.pmtiles" \
            --bbox="${{ inputs.bbox }}" --maxzoom=${{ inputs.maxzoom }} $EXTRA
          ls -lh *.pmtiles 2>/dev/null || true
      - name: Lugares adicionales de Overture Maps (opcional)
        if: ${{ !inputs.dry_run && inputs.overture }}
        continue-on-error: true
        run: |
          pip install duckdb
          python tools/overture_places.py --salida lugares_extra.jsonl
      - name: Rutas y búsqueda (.g593)
        if: ${{ !inputs.dry_run }}
        run: |
          pip install osmium numpy
          curl -L -o ecuador.osm.pbf https://download.geofabrik.de/south-america/ecuador-latest.osm.pbf
          FLAG=""; if [ "${{ inputs.sin_servicio }}" = "true" ]; then FLAG="--sin-servicio"; fi
          if [ -s lugares_extra.jsonl ]; then FLAG="$FLAG --extra lugares_extra.jsonl"; fi
          python tools/build_graph.py ecuador.osm.pbf "${{ inputs.nombre }}.g593" $FLAG
          ls -lh *.g593
      - name: Manifiesto de descarga (versión, tamaños y sumas de verificación)
        if: ${{ !inputs.dry_run }}
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          BASE="${BASE_URL:-https://github.com/$GITHUB_REPOSITORY/releases/download/mapas}"
          python tools/make_manifest.py --base "$BASE" --version "$(date -u +%Y.%m.%d)" \
            "${{ inputs.nombre }}.pmtiles" "${{ inputs.nombre }}.g593" > manifest.json
          cat manifest.json
      - name: Publicar en Releases
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mapas -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create mapas -R "$GITHUB_REPOSITORY" --title "Mapas y datos de GPS 593" \
              --notes "Archivos para usar sin internet: copia el .pmtiles y el .g593 al pendrive."
          gh release upload mapas "${{ inputs.nombre }}.pmtiles" "${{ inputs.nombre }}.g593" manifest.json -R "$GITHUB_REPOSITORY" --clobber
          echo "Descarga: https://github.com/$GITHUB_REPOSITORY/releases/tag/mapas"
      - name: Publicar en Cloudflare R2 (opcional, solo si definiste la variable R2_BUCKET)
        if: ${{ !inputs.dry_run && vars.R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          # Primero los archivos grandes y al final el manifiesto, para que la app nunca vea una versión a medias
          for f in "${{ inputs.nombre }}.pmtiles" "${{ inputs.nombre }}.g593"; do
            aws s3 cp "$f" "s3://$R2_BUCKET/$f" --endpoint-url "$R2_ENDPOINT"
          done
          aws s3 cp manifest.json "s3://$R2_BUCKET/manifest.json" --endpoint-url "$R2_ENDPOINT" --cache-control "no-cache"
